name: Build Provenance

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest:
    name: Build and attest deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build deployment files
        run: node scripts/build.mjs

      - name: Verify generated deployment files
        run: git diff --exit-code -- dist

      - name: Package deterministic deployment artifact
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf site-dist.tar.gz dist .openai/hosting.json
          sha256sum site-dist.tar.gz > site-dist.tar.gz.sha256

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: site-dist.tar.gz

      - name: Retain attested build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-build-${{ github.sha }}
          path: |
            site-dist.tar.gz
            site-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
