name: Build Provenance

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest:
    name: Build and attest deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build deployment files
        run: node scripts/build.mjs

      - name: Verify generated deployment files
        run: git diff --exit-code -- dist

      - name: Package deterministic deployment artifact
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf vercel-dist.tar.gz dist/client dist/server api vercel.json
          sha256sum vercel-dist.tar.gz > vercel-dist.tar.gz.sha256

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: vercel-dist.tar.gz

      - name: Retain attested build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-build-${{ github.sha }}
          path: |
            vercel-dist.tar.gz
            vercel-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
